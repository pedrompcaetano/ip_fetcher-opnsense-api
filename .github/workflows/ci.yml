name: CI Build with Podman

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build container image with Podman
        run: |
          podman build -t localhost/opnsense-api:latest .

      - name: Verify image creation
        run: |
          podman images
          podman run --rm localhost/opnsense-api:latest /opnsense_api --help || true

      - name: Save Podman image to archive
        run: |
          podman save --format docker-archive -o opnsense-api.tar localhost/opnsense-api:latest

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: docker-archive:opnsense-api.tar
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: opnsense-api-sbom
          path: sbom.json
