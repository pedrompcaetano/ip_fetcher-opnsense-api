name: CI Build with Podman

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build container image with Podman
        run: |
          podman build -t localhost/opnsense-api:latest .

      - name: Verify image creation
        run: |
          podman images
          podman run --rm localhost/opnsense-api:latest /opnsense_api --help || true

      - name: Save Podman image to archive
        run: |
          podman save --format docker-archive -o opnsense-api.tar localhost/opnsense-api:latest

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: docker-archive:opnsense-api.tar
          format: cyclonedx-json
          output-file: sbom.json

      - name: Scan SBOM for Vulnerabilities (Grype)
        id: grype-scan
        uses: anchore/scan-action@v7
        with:
          sbom: "sbom.json"
          fail-build: false  # Allow SARIF upload before failing
          severity-cutoff: high

      - name: Calculate Vulnerability Count
        id: count_vulns
        run: |
          # Count total matches using Grype JSON output
          COUNT=$(grype sbom:sbom.json -o json | jq '.matches | length')
          echo "COUNT=$COUNT" >> $GITHUB_OUTPUT
          
          # Set badge color based on count
          if [ "$COUNT" -eq "0" ]; then
            echo "COLOR=brightgreen" >> $GITHUB_OUTPUT
          else
            echo "COLOR=red" >> $GITHUB_OUTPUT
          fi

      - name: Update Vulnerability Badge Gist
        uses: schneegans/dynamic-badges-action@v1.9.0
        if: always()
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 78a8240d278d62fae119fb919b12e689
          filename: vulnerabilities.json
          label: vulnerabilities
          message: "${{ steps.count_vulns.outputs.COUNT }}"
          color: "${{ steps.count_vulns.outputs.COLOR }}"

      - name: Upload SARIF Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: opnsense-api-sbom
          path: sbom.json
