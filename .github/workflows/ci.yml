name: CI Build with Podman

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@main

      - name: Build container image with Podman
        run: |
          podman build -t localhost/opnsense-api:latest .

      - name: Verify image creation
        run: |
          podman images
          podman run --rm localhost/opnsense-api:latest /opnsense_api --help || true
